name: Build Termux package

on: [push, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_arch: [aarch64, arm, i686, x86_64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: self

      - name: Clone termux-packages
        run: git clone --depth 1 https://github.com/termux/termux-packages.git

      - name: Add apk-tools package
        run: cp -r self/packages/apk-tools termux-packages/packages/apk-tools

      - name: Build package in docker
        run: |
          cd termux-packages
          ./scripts/run-docker.sh ./build-package.sh -I -C -a "${{ matrix.target_arch }}" --format debian -o output packages/apk-tools

      - name: Upload apk-tools .deb
        uses: actions/upload-artifact@v4
        with:
          name: apk-tools-${{ matrix.target_arch }}
          path: termux-packages/output/apk-tools_*.deb
          retention-days: 7